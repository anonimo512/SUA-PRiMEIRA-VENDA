<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do Zero à Primeira Venda</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f4;--card:#fff;--ink:#12263a;--mut:#5a6b7b;--ok:#13875a;--sun:#ffc247;--line:#d9e2e0;--warn:#fff4d6;--wt:#6b4a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--card:#16283a;--ink:#eaf1f5;--mut:#9db0c0;--ok:#35c48b;--line:#26405a;--warn:#3a2f10;--wt:#ffd98a}}
:root[data-theme="dark"]{--bg:#0e1a26;--card:#16283a;--ink:#eaf1f5;--mut:#9db0c0;--ok:#35c48b;--line:#26405a;--warn:#3a2f10;--wt:#ffd98a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 80px}
h1,h2,h3{line-height:1.15;margin:.2em 0 .4em}h1{font-size:2.3rem;font-weight:800}h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:.4em 0}.mut{color:var(--mut)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:720px;margin:0 auto}
nav button{flex:none;background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:inline-block;background:var(--ok);color:#fff;border:0;border-radius:12px;padding:14px 22px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;min-height:48px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn.sm{padding:8px 14px;min-height:40px;font-size:.9rem}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hero{padding:48px 0 24px}.hero .mark{display:inline-block;background:var(--sun);color:#12263a;font-weight:800;padding:4px 12px;border-radius:8px;transform:rotate(-2deg)}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--sun));width:0;transition:width .5s}
.step{display:flex;gap:12px;align-items:flex-start;transition:border-color .3s,background .3s}.step.done{border-color:var(--ok)}
.num{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}.done .num{background:var(--ok);color:#fff}
.chk{width:26px;height:26px;accent-color:var(--ok);flex:none;margin-top:2px}
.tag{display:inline-block;font-size:.8rem;font-weight:700;color:var(--ok);margin-left:6px}
.warn{background:var(--warn);color:var(--wt);border-radius:12px;padding:12px 14px;margin:12px 0}
.prompt{background:var(--bg);border:1px dashed var(--mut);border-radius:12px;padding:12px;margin:10px 0;font-size:.95rem}
.sub{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.sub:last-child{border:0}
ol,ul{padding-left:20px}li{margin:4px 0}
details{border-bottom:1px solid var(--line);padding:10px 0}summary{font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:14px 20px;border-radius:14px;z-index:9;animation:pop .4s;max-width:90%}
@keyframes pop{from{transform:translate(-50%,30px);opacity:0}}
.ach{display:inline-block;padding:6px 12px;margin:4px 4px 0 0;border-radius:99px;border:1px solid var(--line);font-size:.9rem;opacity:.45}.ach.on{opacity:1;background:var(--sun);color:#12263a;border-color:var(--sun)}
.view{animation:fade .3s}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav id="nav" hidden></nav><main id="app"></main>
<script>
const STEPS=[
{t:"Encontre uma ideia",d:"Descubra qual problema resolver e para quem.",i:"Antes de criar qualquer produto, você precisa descobrir qual problema deseja resolver e para quem. Você pode usar o Claude ou o ChatGPT para pesquisar ideias.",p:"Me dê 10 ideias de produtos digitais que resolvam problemas reais de pessoas interessadas em [NICHO]. Para cada ideia, explique o problema que ela resolve, quem seria o público-alvo e qual formato de produto seria mais adequado.",c:["Escolhi um nicho","Identifiquei um problema","Escolhi uma ideia","Defini meu público-alvo"]},
{t:"Transforme a ideia em um produto",d:"Use IA para estruturar e produzir o conteúdo.",i:"A IA pode ajudar a estruturar o produto. Formatos possíveis: e-book, guia, curso, checklist, template, material educativo ou tutorial.",p:"Crie uma estrutura completa para um produto digital sobre [TEMA]. Organize o conteúdo em módulos ou capítulos, explique o objetivo de cada parte e sugira exercícios, exemplos e materiais complementares.",w:"O conteúdo gerado por IA deve ser revisado, corrigido e adaptado por você antes de ser vendido.",c:["Defini o formato","Criei a estrutura","Produzi o conteúdo","Revisei o material","Finalizei o produto"]},
{t:"Crie sua página",d:"Peça ao Claude uma página para apresentar o produto.",i:"Você pode usar o próprio Claude para criar uma página profissional que apresente o seu produto.",p:"Crie uma página de vendas moderna, profissional e responsiva para meu produto digital chamado [NOME DO PRODUTO]. A página deve conter título, subtítulo, problema, solução, benefícios, o que está incluído no produto, perguntas frequentes e uma chamada para ação. Não faça promessas de ganhos garantidos. Utilize uma linguagem clara, persuasiva e ética.",c:["Criei a página","Adicionei o nome do produto","Adicionei a descrição","Adicionei os benefícios","Revisei a página","Testei no celular"]},
{t:"Coloque seu site no ar",d:"Publique a página com uma hospedagem, como o GitHub Pages.",i:"O projeto pode ser publicado em serviços de hospedagem compatíveis, incluindo o GitHub Pages quando adequado.",l:["Criar uma conta no GitHub.","Criar um repositório.","Adicionar os arquivos do site.","Configurar a publicação.","Aguardar a publicação.","Copiar o endereço público.","Testar o site."],a:["GitHub","https://github.com"],w:"Os menus e configurações do GitHub podem mudar. Sempre confira a documentação atual da plataforma.",c:["Criei minha conta no GitHub","Criei o repositório","Enviei os arquivos","Publiquei o site","Copiei o link","Testei o endereço"]},
{t:"Configure sua conta na Kiwify",d:"Crie a conta onde seu produto será cadastrado e vendido.",i:"Agora você precisa criar sua conta na Kiwify, plataforma que será utilizada para cadastrar e vender seu produto digital. Essa etapa é feita no site da Kiwify.",l:["Acesse a Kiwify.","Crie sua conta.","Preencha seus dados corretamente.","Configure as informações necessárias para receber pagamentos.","Faça as verificações solicitadas pela plataforma.","Leia os termos e regras antes de publicar seu produto."],a:["Abrir a Kiwify","https://kiwify.com.br"],w:"Se você for menor de 18 anos, não utilize informações falsas nem tente burlar as regras da plataforma. Verifique as regras atuais da Kiwify e converse com seu responsável legal para saber qual procedimento é permitido.",c:["Criei minha conta","Preenchi meus dados corretamente","Configurei as informações necessárias","Verifiquei minha conta","Li as regras da Kiwify"]},
{t:"Cadastre seu produto",d:"Crie e publique o produto no painel da Kiwify.",i:"Faça este processo no painel da Kiwify. Os nomes de menus e opções podem variar conforme a interface atual: confira a opção correspondente no seu painel.",l:["Acesse o painel da Kiwify.","Selecione a opção para criar um produto.","Informe o nome do produto.","Adicione uma descrição.","Defina o preço.","Configure a entrega do produto.","Adicione a imagem do produto.","Revise as informações.","Publique."],c:["Criei o produto","Coloquei o nome","Escrevi a descrição","Defini o preço","Configurei a entrega","Adicionei a imagem","Revisei tudo","Publiquei"]},
{t:"Crie uma imagem profissional",d:"Uma boa imagem ajuda a apresentar o produto.",i:"Use uma ferramenta de geração de imagens por IA, como o ChatGPT, quando disponível. Formato solicitado: 300 × 250 pixels.",p:"Crie uma imagem profissional para divulgar meu produto digital chamado [NOME DO PRODUTO]. O design deve ser moderno, limpo, chamativo e transmitir confiança. Destaque visualmente o nome do produto e represente o benefício principal. Formato 300 × 250 pixels.",c:["Criei a imagem","A imagem está em 300 × 250 px","O nome está correto","A imagem representa o produto"]},
{t:"Crie sua presença nas redes sociais",d:"Monte perfis dedicados ao projeto.",i:"Crie perfis dedicados ao projeto no Instagram, TikTok, Facebook e X/Twitter, e mantenha uma identidade visual parecida entre eles. Cada perfil é criado na própria plataforma.",c:["Criei meu Instagram","Criei meu TikTok","Criei meu Facebook","Criei meu perfil no X/Twitter","Escolhi uma foto de perfil","Escrevi uma bio","Adicionei o link correto"]},
{t:"Publique conteúdo",d:"Comece a divulgar o produto.",i:"Agora começa uma das partes mais importantes: divulgar seu produto. Vídeos curtos, dicas gratuitas, conteúdo educativo, tutoriais, demonstrações, bastidores e perguntas e respostas funcionam bem.",ideas:["3 erros que pessoas do nicho [NICHO] cometem.","Como resolver [PROBLEMA] de forma simples.","O que eu gostaria de ter aprendido quando comecei.","Passo a passo para [RESULTADO REALISTA]."],w:"Não prometa resultados financeiros garantidos. Não invente clientes, vendas, depoimentos ou faturamentos.",c:["Criei meu primeiro conteúdo","Publiquei no Instagram","Publiquei no TikTok","Publiquei no Facebook","Publiquei no X/Twitter","Coloquei o link do produto","Mantive uma frequência de publicação"]},
{t:"Conquiste sua primeira venda",d:"Analise o que funcionou e registre seu resultado.",i:"Sua primeira venda não é o fim. É o começo. Analise: de onde veio o cliente, qual conteúdo o trouxe, qual rede social teve melhor desempenho, qual oferta chamou mais atenção e quais dúvidas ele tinha.",res:1,c:["Tive minha primeira venda","Descobri de onde veio o cliente","Anotei as dúvidas do cliente"]}];
const ACH=[["🏆 Primeira etapa concluída",s=>s.some(x=>x)],["🏆 Produto criado",s=>s[1]],["🏆 Site publicado",s=>s[3]],["🏆 Produto cadastrado",s=>s[5]],["🏆 Primeiro conteúdo publicado",s=>s[8]],["🏆 Primeira venda",s=>s[9]]];
const FAQ=[["Preciso saber programação?","Não necessariamente. Existem ferramentas de IA e plataformas que permitem criar produtos e páginas sem conhecimento avançado de programação."],["Posso usar o Claude para criar meu produto?","Sim. O Claude pode ajudar a pesquisar ideias, organizar informações, estruturar conteúdos e desenvolver páginas. Porém, revise todo o material antes de utilizá-lo comercialmente."],["Posso usar o ChatGPT também?","Sim. Você pode utilizar diferentes ferramentas de IA para tarefas diferentes, desde que respeite os termos de uso e revise o conteúdo produzido."],["Preciso gastar dinheiro para começar?","Depende das ferramentas escolhidas. Algumas possuem planos gratuitos e outras possuem custos. Verifique os preços atuais antes de contratar qualquer serviço."],["Posso vender qualquer produto na Kiwify?","Não necessariamente. Você precisa seguir as regras da Kiwify e as leis aplicáveis. Certifique-se de que seu produto é permitido antes de publicá-lo."],["Sou menor de 18 anos. Posso vender?","Isso depende das regras atuais da plataforma e da legislação aplicável. Não utilize dados falsos. Converse com seu responsável legal e verifique as condições da Kiwify."],["Quanto vou ganhar?","Não existe garantia de ganhos. Os resultados dependem de diversos fatores, incluindo produto, público, preço, demanda, qualidade da oferta e divulgação."],["E se eu não fizer nenhuma venda?","Isso não significa necessariamente que o produto não funciona. Analise seu público, oferta, preço, conteúdo e estratégia de divulgação e faça melhorias."],["Como conseguir mais clientes?","Crie conteúdo útil, entenda seu público, teste diferentes formatos e acompanhe quais conteúdos geram mais interesse."],["Como colocar meu link nas redes sociais?","Utilize os campos de link disponíveis em cada plataforma e confira se o endereço está funcionando antes de divulgar."]];const KEY="dzpv1";let S={name:"",d:[],k:{},r:{}},V="welcome",CUR=0;
try{const x=sessionStorage.getItem(KEY);if(x){S=JSON.parse(x);V=S.name?"home":"welcome"}}catch(e){}
const save=()=>{try{sessionStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cnt=()=>STEPS.filter((_,i)=>S.d[i]).length;
function go(v,i){V=v;if(i!=null)CUR=i;render();window.scrollTo(0,0)}
function toast(m){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function setDone(i,v){const before=ACH.map(a=>a[1](S.d));S.d[i]=v;STEPS[i].c.forEach((_,j)=>S.k[i+"-"+j]=v);save();
 if(v){const after=ACH.map(a=>a[1](S.d));const n=after.findIndex((x,j)=>x&&!before[j]);if(n>-1)toast(ACH[n][0]+" — parabéns!");else toast("Etapa concluída! ✅")}}
function copy(t,b){const ok=()=>{b.textContent="Copiado ✓"};try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
 function fb(){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){b.textContent="Selecione e copie"}a.remove()}}
function bar(){const n=cnt(),p=Math.round(n/10*100);return `<div class="card"><b>Seu progresso</b><div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" style="margin:8px 0"><i style="width:${p}%"></i></div><b>${p}% concluído</b> <span class="mut">· ${n} de 10 etapas concluídas</span></div>`}
function achs(){return ACH.map(a=>`<span class="ach ${a[1](S.d)?"on":""}">${a[0]}</span>`).join("")}
function renderNav(){const n=$("nav");n.hidden=!S.name;if(!S.name)return;const t=[["home","Jornada"],["faq","Dúvidas"],["real","Resultados reais"],["final","Checklist final"]];
 n.innerHTML=t.map(x=>`<button data-v="${x[0]}" class="${V==x[0]||(V=="step"&&x[0]=="home")?"on":""}">${x[1]}</button>`).join("");n.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.v))}
function render(){renderNav();const a=$("app");let h="";
 if(V=="welcome")h=`<section class="view hero"><span class="mark">Passo a passo</span><h1>DO ZERO À PRIMEIRA VENDA</h1><p class="mut">Aprenda, passo a passo, como transformar uma ideia em um produto digital e começar a divulgá-lo na internet.</p><p><button class="btn" id="go">COMEÇAR AGORA</button></p></section>`;
 else if(V=="signup")h=`<section class="view card"><h2>Vamos começar?</h2><p class="mut">Preencha seus dados para personalizar sua jornada.</p><form id="f"><label for="n">Nome</label><input id="n" required autocomplete="given-name"><label for="p">Número de telefone</label><input id="p" type="tel" required autocomplete="tel"><label for="e">E-mail</label><input id="e" type="email" required autocomplete="email"><p class="mut" style="font-size:.85rem">Seus dados ficam só nesta página, no seu aparelho. Nada é enviado nem exibido publicamente.</p><button class="btn" type="submit">CONTINUAR</button></form></section>`;
 else if(V=="home")h=`<section class="view"><h2>Olá, ${esc(S.name)}! 👋</h2><p class="mut">Pronto para começar sua jornada até a primeira venda?</p><h1>Sua Jornada</h1>${bar()}<div>${achs()}</div>${(()=>{const nx=STEPS.findIndex((_,i)=>!S.d[i]);return nx>-1?`<div class="card" style="border-color:var(--sun)"><b>Próxima etapa:</b> ${nx+1} — ${STEPS[nx].t}<br><button class="btn sm" data-o="${nx}" style="margin-top:8px">Continuar</button></div>`:""})()}${STEPS.map((s,i)=>`<div class="card step ${S.d[i]?"done":""}"><div class="num">${i+1}</div><div style="flex:1"><h3>${s.t}${S.d[i]?'<span class="tag">Concluído</span>':""}</h3><p class="mut">${s.d}</p><button class="btn alt sm" data-o="${i}">Ver tutorial</button></div><input type="checkbox" class="chk" data-m="${i}" ${S.d[i]?"checked":""} aria-label="Etapa ${i+1} concluída"></div>`).join("")}</section>`;
 else if(V=="step"){const s=STEPS[CUR],i=CUR;h=`<section class="view"><button class="btn alt sm" id="bk">← Voltar</button><h2 style="margin-top:12px">Etapa ${i+1} — ${s.t}</h2><p>${s.i}</p>
 ${s.p?`<div class="prompt"><b>Prompt:</b><br>“${esc(s.p)}”</div><button class="btn sm" id="cp">COPIAR PROMPT</button>`:""}
 ${s.l?`<ol>${s.l.map(x=>`<li>${x}</li>`).join("")}</ol>`:""}
 ${s.a?`<p><a class="btn alt sm" href="${s.a[1]}" target="_blank" rel="noopener noreferrer">${s.a[0]}</a></p>`:""}
 ${s.ideas?`<h3>IDEIAS DE CONTEÚDO</h3><ul>${s.ideas.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
 ${s.w?`<div class="warn">⚠️ ${s.w}</div>`:""}
 <div class="card">${s.c.map((x,j)=>`<label class="sub" style="margin:0;font-weight:400"><input type="checkbox" class="chk" data-s="${j}" ${S.k[i+"-"+j]?"checked":""}> ${x}</label>`).join("")}</div>
 ${s.res?`<div class="card"><h3>Registre seu resultado</h3><label for="r1">Número de vendas</label><input id="r1" inputmode="numeric" value="${esc(S.r.v||"")}"><label for="r2">Faturamento</label><input id="r2" value="${esc(S.r.f||"")}"><label for="r3">Período</label><input id="r3" placeholder="ex.: 7 dias" value="${esc(S.r.p||"")}"><label for="r4">Principal fonte de clientes</label><input id="r4" value="${esc(S.r.s||"")}"><p class="mut" style="font-size:.85rem">Este registro é só para o seu controle. Não é comprovante de renda.</p></div>`:""}
 <button class="btn ${S.d[i]?"alt":""}" id="dn">${S.d[i]?"Concluído ✓ (desmarcar)":"Marcar etapa como concluída"}</button></section>`}
 else if(V=="faq")h=`<section class="view"><h2>❓ DÚVIDAS FREQUENTES</h2>${FAQ.map(q=>`<details><summary>${q[0]}</summary><p class="mut">${q[1]}</p></details>`).join("")}</section>`;
 else if(V=="real")h=`<section class="view"><h2>Como divulgar resultados reais</h2><div class="card"><p>Se você realmente faturou R$ 100 em um dia: <b>“Faturamento real de R$ 100 em 1 dia.”</b></p><p>Se o resultado levou uma semana: <b>“Faturamento real de R$ 100 em 7 dias.”</b></p><p>Informe sempre o período correto. Não transforme um resultado individual em promessa de ganho para outras pessoas.</p></div><div class="warn">⚠️ Nunca fabrique prints, comprovantes, depoimentos ou números de faturamento para tentar convencer clientes.</div></section>`;
 else if(V=="final"){const all=cnt()==10;h=`<section class="view"><h2>🚀 CHECKLIST FINAL</h2>${bar()}<div class="card">${STEPS.map((s,i)=>`<div class="sub">${S.d[i]?"☑":"☐"} ${s.t}</div>`).join("")}</div>${all?`<div class="card" style="border-color:var(--sun)"><h2>🎉 PARABÉNS!</h2><p>Você completou sua jornada do zero até a primeira venda.</p><button class="btn" id="rv">REVISAR TODO O TUTORIAL</button> <button class="btn alt" id="rs">COMEÇAR NOVAMENTE</button></div>`:`<p class="mut">Conclua as 10 etapas para liberar a celebração final.</p>`}<button class="btn alt sm" id="rs2">Recomeçar do zero</button></section>`}
 a.innerHTML=h;bind()}
function bind(){const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
 if(q("#go"))q("#go").onclick=()=>go("signup");
 if(q("#f"))q("#f").onsubmit=e=>{e.preventDefault();S.name=q("#n").value.trim();save();go("home")};
 qa("[data-o]").forEach(b=>b.onclick=()=>go("step",+b.dataset.o));
 qa("[data-m]").forEach(c=>c.onchange=()=>{setDone(+c.dataset.m,c.checked);render()});
 if(q("#bk"))q("#bk").onclick=()=>go("home");
 if(q("#cp"))q("#cp").onclick=e=>copy(STEPS[CUR].p,e.target);
 qa("[data-s]").forEach(c=>c.onchange=()=>{const j=+c.dataset.s,s=STEPS[CUR];S.k[CUR+"-"+j]=c.checked;const all=s.c.every((_,x)=>S.k[CUR+"-"+x]);
  if(all&&!S.d[CUR]){setDone(CUR,true);render()}else if(!c.checked&&S.d[CUR]){S.d[CUR]=false;save();render()}else save()});
 [["r1","v"],["r2","f"],["r3","p"],["r4","s"]].forEach(x=>{const e=q("#"+x[0]);if(e)e.oninput=()=>{S.r[x[1]]=e.value;save()}});
 if(q("#dn"))q("#dn").onclick=()=>{setDone(CUR,!S.d[CUR]);render()};
 if(q("#rv"))q("#rv").onclick=()=>go("home");
 ["#rs","#rs2"].forEach(id=>{if(q(id))q(id).onclick=()=>{if(confirm("Apagar todo o progresso e começar novamente?")){S={name:S.name,d:[],k:{},r:{}};save();go("home")}}})}
render();
</script></body></html>
